<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><h1>Admin Login</h1></header>

  <form method="POST" style="max-width:350px; margin:30px auto; display:flex; flex-direction:column; gap:12px;">
    {% for message in get_flashed_messages() %}
      <p style="color:#c0392b">{{ message }}</p>
    {% endfor %}
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>

  <p style="text-align:center"><a href="{{ url_for('home') }}">Back to shop</a></p>
</body>
</html>
