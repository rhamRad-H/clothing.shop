<!DOCTYPE html>
<html>
<head>
  <title>My Clothing Shop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><h1>My Clothing Shop</h1></header>
  <p><a href="{{ url_for('cart') }}" style="color:rgb(46, 22, 0)">Cart: {{ cart_count }} items</a></p>

  <div class="grid">
    {% for item in items %}
      <div class="card">
        <img class="pic" src="{{ url_for('static', filename='images/' + item.image) }}" alt="{{ item.name }}">
        <h2>{{ item.name }}</h2>
        <p class="price">${{ item.price }}</p>
        <a href="{{ url_for('add_to_cart', item_id=item.id) }}"><button>Add to cart</button></a>
      </div>
    {% endfor %}
  </div>
</body>
</html>
